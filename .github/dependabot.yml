version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      raycast:
        patterns: ["@raycast/*", "@types/node", "@types/react"]
      dev-tooling:
        patterns: ["eslint*", "prettier", "typescript", "vitest", "@vitest/*"]
    ignore:
      # @raycast/eslint-config pins typescript to >=4.8.4 <6.1.0, so a major bump
      # fails npm ci on ERESOLVE, not on anything this repository can fix.
      # Revisit when @raycast/eslint-config widens the range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @raycast/api peer-depends on exact versions of these two, and the runtime is
      # Raycast's own Node 22.22.2. They must move when @raycast/api moves, never on
      # their own: a bump to @types/node 26 typechecks against a runtime that is not
      # there. Do NOT remove without checking @raycast/api's peerDependencies.
      - dependency-name: "@types/node"
      - dependency-name: "@types/react"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
